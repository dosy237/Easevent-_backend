services:
  web:
    build: .
    image: easevent-backend
    container_name: web
    command: gunicorn easevent.wsgi:application --bind 0.0.0.0:8000 --timeout 120
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "127.0.0.1:8009:8000"     # joignable seulement par nginx (même machine)
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynetwork

  db:
    image: postgres:15
    container_name: db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - PGPORT=${DB_PORT:-5436}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # Base de données : jamais exposée sur Internet (accès local uniquement)
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:${DB_PORT:-5436}"
    networks:
      - mynetwork

  redis:
    image: redis:7
    container_name: redis
    restart: always
    # Pas de port publié : Redis (sans mot de passe) reste interne au réseau Docker
    networks:
      - mynetwork

  # Messagerie instantanée (WebSocket /ws/) : nginx y envoie les connexions /ws/
  realtime:
    build: .
    image: easevent-backend
    container_name: realtime
    command: daphne -b 0.0.0.0 -p 8001 --proxy-headers easevent.asgi:application
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8010:8001"
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - mynetwork

  # Tâches de fond : envoi des invitations (emails, SMS), rappels…
  celery:
    build: .
    image: easevent-backend
    container_name: celery
    command: celery -A easevent worker -l info --concurrency=2
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - mynetwork

  # Planificateur : rappels (chaque heure), bilan du jour (20:00), ménage (03:30)
  celery-beat:
    build: .
    image: easevent-backend
    container_name: celery-beat
    command: celery -A easevent beat -l info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    networks:
      - mynetwork

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge
