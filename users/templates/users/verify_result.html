{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{{ title }} — Easevent</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:#F7F7F7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1A1A1A}
    main{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:32px 24px;border:1px solid #E8E8E8;text-align:center}
    .badge{width:72px;height:72px;border-radius:36px;margin:20px auto 0;display:flex;align-items:center;justify-content:center}
    .ok{background:#E8F5EE;color:#1B6B4A}.ko{background:#FFF5F5;color:#C53030}
    h1{font-size:24px;font-weight:900;margin:16px 0 8px}
    p{font-size:16px;line-height:24px;color:#555;margin:0 0 24px}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:16px;
      background:#1B6B4A;color:#fff;font-size:16px;font-weight:800;text-decoration:none}
    .btn:focus-visible{outline:3px solid #E76F51;outline-offset:2px}
    small{display:block;margin-top:20px;color:#757575;font-size:13px}
  </style>
</head>
<body>
  <main>
    <img src="{% static 'app/logo.svg' %}" width="56" height="56" alt="Easevent">
    <div class="badge {% if status == 'success' %}ok{% else %}ko{% endif %}" aria-hidden="true">
      {% if status == 'success' %}
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      {% else %}
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      {% endif %}
    </div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn" href="easevent://connexion">Ouvrir l'application Easevent</a>
    <small>Easevent &copy; {% now "Y" %}</small>
  </main>
</body>
</html>
