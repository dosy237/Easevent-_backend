{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{{ title }} — Easevent</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:#F7F7F7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1A1A1A}
    main{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:32px 24px;border:1px solid #E8E8E8;text-align:center}
    h1{font-size:24px;font-weight:900;margin:16px 0 8px}
    p{font-size:16px;line-height:24px;color:#555;margin:0 0 24px}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:16px;
      background:#1B6B4A;color:#fff;font-size:16px;font-weight:800;text-decoration:none}
    .btn:focus-visible{outline:3px solid #E76F51;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <img src="{% static 'app/logo.svg' %}" width="56" height="56" alt="Easevent">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn" id="open" href="{{ deeplink }}">Ouvrir l'application Easevent</a>
  </main>
  <script>setTimeout(function(){ window.location.href = document.getElementById('open').href; }, 400);</script>
</body>
</html>
