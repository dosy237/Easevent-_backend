# nginx (sur le serveur hôte) — easevent.nitypulse.com
# Le certificat HTTPS est géré par certbot (bloc 443 ajouté par « certbot --nginx »)
# ou par le proxy en amont. Adapter les chemins /static/ et /media/ au dossier du projet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Si un proxy en amont termine le HTTPS, on garde son X-Forwarded-Proto
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name easevent.nitypulse.com;

    # Photos de la messagerie (8 Mo) et images envoyées en base64
    client_max_body_size 15m;

    # Messagerie instantanée : WebSocket vers le service « realtime » (daphne)
    location /ws/ {
        proxy_pass http://127.0.0.1:18010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;      # connexion gardée ouverte (ping toutes les 25 s)
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /home/eddy/projects/Easevent-_backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        # Logo et illustrations chargés par la version web de l'application (autre domaine)
        add_header Access-Control-Allow-Origin "*";
    }

    location /media/ {
        alias /home/eddy/projects/Easevent-_backend/media/;
        expires 7d;
    }
}
